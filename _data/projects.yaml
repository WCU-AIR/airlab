- title: Robotic Control Reasoning with Locally-Hosted LLMs
  group: on-going
  description: A kinematic-semantic evaluation framework that connects the Webots physics simulator to locally hosted LLMs through Ollama, separating fine-grained robot controls from high-level natural-language commands. Led by Avery Leber (SURI 2026); the first paper won Best Student Paper at CCSC Eastern 2026.
  citations:
    - Evaluating the Robotic Control Reasoning Potential of Locally-Hosted LLMs
  tags:
    - large language models
    - robotics

- title: Pushing the Limits of Local AI - Benchmarking LLMs for Code Generation
  group: on-going
  image: images/other/llm_eval_poster.png
  link: https://github.com/WCU-AIR/face-llm-eval
  description: Extends our award-winning evaluation of locally hosted LLMs from eight open-source models to more than fifty (0.5B to 14B parameters), benchmarked on HumanEval, MBPP+, CodeContests, and curated Kattis and LeetCode corpora. Led by Kadin Matotek with support from SURF, the CSM Undergraduate Student Research Award, and SRCA.
  repo: https://github.com/WCU-AIR/face-llm-eval
  citations:
    - Evaluating the Limitations of Local LLMs in Solving Complex Programming Challenges
    - "FACE: A Framework for AI-Driven Coding Generation Evaluation"
  tags:
    - large language models

- title: Dual-Model RAG for Grounded Student Support
