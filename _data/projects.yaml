- title: ASL Recognition, Translation, and Game-Based Learning
  group: on-going
  description: Machine vision, CNN, and transformer models for bidirectional translation between American Sign Language and English, and a gamified vocabulary learning system for Deaf learners. In collaboration with Dr. Stefanie Amiruzzaman.
